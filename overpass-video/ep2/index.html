<!doctype html>
<html><head><meta charset="utf-8"><title>The Overpass – Episode 2</title>
<style>
@font-face { font-family: Lucky; src: url(../fonts/LuckiestGuy.woff2); }
@font-face { font-family: Fredoka; font-weight: 500; src: url(../fonts/fredoka-latin-500-normal.woff2); }
@font-face { font-family: Fredoka; font-weight: 600; src: url(../fonts/fredoka-latin-600-normal.woff2); }
@font-face { font-family: Fredoka; font-weight: 700; src: url(../fonts/fredoka-latin-700-normal.woff2); }
html, body { margin: 0; background: #000; overflow: hidden; }
</style></head>
<body>
<svg id="stage" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
<script src="timeline.js"></script>
<script src="../lib.js"></script>
<script src="../world.js"></script>
<script src="../ui.js"></script>
<script src="scenes.js"></script>
<script src="../overlays.js"></script>
<script>
const stage = document.getElementById('stage');
window.render = t => { stage.innerHTML = frame(t); };
window.fontsReady = Promise.all(['Lucky', '500 10px Fredoka', '600 10px Fredoka', '700 10px Fredoka']
  .map(f => document.fonts.load(f.includes('px') ? f : `40px ${f}`))).then(() => document.fonts.ready);
</script>
</body></html>
